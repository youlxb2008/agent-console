server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # 2026-08-28 M1.5 修正：后端两类路径风格分流
    # - 基线 system 域 controller 无 /api 前缀（/system/*）→ 剥掉 /api 转发
    # - agent/portal 域 controller 带 /api 前缀（/api/agent|portal/*）→ 原样转发
    # v3.5 补充：notebook 域（/api/system/notebook/*）自带 /api 前缀 → 需在 /api/system 之前精确匹配原样转发
    # 不写尾斜杠：POST /api/system/notebook（无尾斜杠）也能匹配，不会被 /api/system/ 误剥前缀
    location /api/system/notebook {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /api/system/ {
        proxy_pass http://backend:8000/system/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # /uploads/* → 后端静态资源（MvcConfig 已将 /uploads/** 映射到磁盘上传目录）
    # 此前缺此规则：/uploads/ 落入门户 dist try_files 返回 index.html（200 text/html）→ 破图
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /admin → 管理端 dist
    location /admin {
        alias /usr/share/nginx/html/admin;
        try_files $uri $uri/ /admin/index.html;
    }

    # / → 门户端 dist
    location / {
        root /usr/share/nginx/html/portal;
        try_files $uri $uri/ /index.html;
    }
}
